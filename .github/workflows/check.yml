name: Software checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest tests/python -q
      - run: gcmsem --help
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
      - run: R CMD build . --no-build-vignettes --no-manual
      - run: R CMD check GCMSEM_*.tar.gz --no-manual --no-vignettes
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          _R_CHECK_FORCE_SUGGESTS_: false
      - run: R CMD INSTALL GCMSEM_*.tar.gz
      - run: python -m pip install .
      - name: Python to R integration
        run: |
          python examples/make_toy_inputs.py --out validation/work/ci
          gcmsem score --manifest validation/work/ci/ld_manifest.tsv --out validation/work/ci/scores.npz
          gcmsem estimate --sumstats validation/work/ci/sumstats.tsv --scores validation/work/ci/scores.npz --noise-intercept validation/work/ci/noise.tsv --out validation/work/ci/result
          Rscript examples/fit_bundle.R validation/work/ci/result
