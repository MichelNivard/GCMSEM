[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcmsem"
version = "0.1.0"
description = "LD-deconvolved genomic cumulants and SEM interchange"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Michel G. Nivard"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Bio-Informatics"]

[project.optional-dependencies]
test = ["pytest>=7"]
validation = ["pandas>=2.0"]

[project.scripts]
gcmsem = "gcmsem.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]
